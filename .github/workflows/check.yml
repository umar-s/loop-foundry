# check — the repository under its own written rules (scripts/lint.sh) on every push and PR.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: repository invariants
        run: bash scripts/lint.sh
